# ربات تمرینی ماری — اجرای خودکار ساعتی روی سرورهای رایگان گیت‌هاب
# قفل: فقط خواندن داده | فقط تمرینی | بدون سفارش واقعی — هیچ کلید صرافی لازم نیست و استفاده نمی‌شود.
#
# وضعیت ربات (معامله‌های فرضی، دفتر شواهد) در برانچ جداگانهٔ «mari-bot-state» ذخیره می‌شود.
# اسرار لازم (Settings → Secrets and variables → Actions):
#   MARI_TELEGRAM_TOKEN    توکن ربات تلگرام (از BotFather)
#   MARI_TELEGRAM_CHAT_ID  شناسهٔ عددی چت شما (از userinfobot)
#   MARI_TELEGRAM_CHANNEL_ID  (اختیاری) کانال عمومی، مثل @mari_honest — ربات باید ادمین کانال باشد
# بدون این دو، ربات کار می‌کند ولی پیام تلگرام نمی‌فرستد.

name: mari-bot

on:
  schedule:
    - cron: "17 */6 * * *"   # فقط پشتیبان: اگر زنجیرهٔ اجراها قطع شد، دوباره راهش می‌اندازد.
                             # کار اصلی را زنجیره انجام می‌دهد (هر اجرا ~۵٫۵ ساعت، هر ساعت یک چرخه).
  workflow_dispatch: {}      # دکمهٔ اجرای دستی

permissions:
  contents: write            # فقط برای ذخیرهٔ وضعیت در برانچ mari-bot-state
  actions: write             # فقط برای اینکه هر اجرا، اجرای بعدی خودش را شروع کند (زنجیره)

concurrency:
  group: mari-bot
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # هر اجرا ~۵٫۵ ساعت، هر ساعت یک چرخه؛ بعد اجرای بعدی را خودش شروع می‌کند
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Load saved state
        run: |
          git config user.name "mari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin mari-bot-state >/dev/null; then
            git fetch --depth=1 origin mari-bot-state:mari-bot-state
            git worktree add state-wt mari-bot-state
          else
            git worktree add --orphan -b mari-bot-state state-wt
          fi

      - name: Tests
        working-directory: scripts
        run: python -m unittest discover -s mari_bot/tests -t .

      - name: Run hourly paper cycles (~5.5h)
        working-directory: scripts
        env:
          MARI_TELEGRAM_TOKEN: ${{ secrets.MARI_TELEGRAM_TOKEN }}
          MARI_TELEGRAM_CHAT_ID: ${{ secrets.MARI_TELEGRAM_CHAT_ID }}
          MARI_TELEGRAM_CHANNEL_ID: ${{ secrets.MARI_TELEGRAM_CHANNEL_ID }}
          MARI_SAVINGS_WEEKLY_USD: ${{ vars.MARI_SAVINGS_WEEKLY_USD }}
        run: |
          # زمان‌بندی گیت‌هاب گاهی ساعت‌ها اجرا نمی‌شود؛ پس خود اجرا هر ساعت یک چرخه می‌زند.
          END=$(( $(date +%s) + 330*60 ))
          save_state() {
            ( cd ../state-wt && rm -f *.tmp && git add -A && \
              { git diff --cached --quiet || { git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"; \
                for i in 1 2 3; do git push -q origin mari-bot-state && break; sleep $((i*5)); done; }; } )
          }
          while :; do
            python -m mari_bot once --state ../state-wt --top 1000 --rotate 0
            save_state
            now=$(date +%s); next=$(( (now / 3600 + 1) * 3600 + 7 * 60 ))
            [ "$next" -ge "$END" ] && break
            echo "چرخهٔ بعد: $(date -u -d @$next +%H:%M) UTC"
            sleep $(( next - now ))
          done

      - name: Alert owner on failure
        if: failure()
        env:
          MARI_TELEGRAM_TOKEN: ${{ secrets.MARI_TELEGRAM_TOKEN }}
          MARI_TELEGRAM_CHAT_ID: ${{ secrets.MARI_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$MARI_TELEGRAM_TOKEN" ] && [ -n "$MARI_TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${MARI_TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$MARI_TELEGRAM_CHAT_ID" \
              --data-urlencode text="🚨 اجرای ربات ماری با خطا تمام شد. جزئیات: $RUN_URL — این لینک را برای Claude بفرست. ⚠️ همه‌چیز تمرینی است — بدون سفارش واقعی" > /dev/null || true
          fi

      - name: Save state
        if: always()
        working-directory: state-wt
        run: |
          rm -f *.tmp
          git add -A
          if git diff --cached --quiet; then
            echo "تغییری نبود"
          else
            git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git push origin mari-bot-state && break; sleep $((i*5)); done
          fi

      - name: Start next run (chain)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # اگر این اجرا خطا داشت، ۱۵ دقیقه صبر کن تا خطای پشت‌سرهم، اجرای بی‌وقفه نسازد.
          if [ "${{ job.status }}" != "success" ]; then sleep 900; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/mari-bot.yml/dispatches" -f ref=main \
            && echo "اجرای بعدی در صف قرار گرفت"
